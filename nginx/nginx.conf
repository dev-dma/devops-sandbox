events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        server_name _;

        # Platform landing page
        location = / {
            return 200 '{"service":"DevOps Sandbox Platform","status":"running"}';
            add_header Content-Type application/json;
        }

        # Dynamically generated environment routes are included here
        include /etc/nginx/conf.d/*.conf;

        # Catch-all 404
        location / {
            return 404 '{"error":"environment not found"}';
            add_header Content-Type application/json;
        }
    }
}
